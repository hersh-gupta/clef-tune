<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500&display=swap" rel="stylesheet">

<style>
  .theme { margin: 0 0 1.2rem; font: inherit; font-size: .85rem; background: none; border: 1px solid var(--border); border-radius: 999px; padding: .3rem .9rem; cursor: pointer; color: var(--text-secondary); }
  .theme:hover { color: var(--text-primary); }
  .row2 { display: flex; gap: 2rem; align-items: flex-start; flex-wrap: wrap; }
  .deskwrap { flex: 1 1 560px; border-radius: 12px; overflow: hidden; border: 1px solid var(--border); }
  .cap { color: var(--text-secondary); font-size: .85rem; margin: .6rem 0 0; }

  .tv {
    --page: #F7F2EA; --line: #DDD0BC; --line-soft: #E8DFD1; --ink: #33302A; --muted: #665E52; --field: #FBF8F3;
    --sage: #5C7A64; --sage-ink: #48644F; --sage-wash: #E9EDE3; --oak: #A88B66; --oak-ink: #5E4E38; --oak-wash: #F0E6D6; --btn-ink: #F7F2EA;
    font-family: "Noto Sans JP", system-ui, sans-serif; color: var(--ink);
  }
  .tv.dark {
    --page: #23211D; --line: #3A362F; --line-soft: #312E28; --ink: #ECE5D8; --muted: #A79E8F; --field: #2A2723;
    --sage: #9DB89F; --sage-ink: #A9C4AB; --sage-wash: #2B302A; --oak: #C9A982; --oak-ink: #D7BD99; --oak-wash: #332D24; --btn-ink: #23211D;
  }
  .phone { width: 360px; height: 740px; flex: none; border-radius: 36px; border: 10px solid #141414; overflow: hidden; position: relative; background: var(--page); box-shadow: 0 30px 60px -30px rgba(0, 0, 0, .6); }
  .phone .app { height: 100%; overflow-y: auto; box-sizing: border-box; padding: 18px 20px 30px; scrollbar-width: none; }
  .phone .app::-webkit-scrollbar { display: none; }

  .app { background: var(--page); text-align: left; transition: background-color .5s ease, color .5s ease; }
  .desk .app { padding: 24px 32px 28px; }
  .app .top { display: flex; align-items: center; gap: 10px; }
  .app .mark { width: 13px; height: 13px; border: 1.5px solid var(--sage); transform: rotate(45deg); }
  .app .top b { font-weight: 500; letter-spacing: .14em; text-transform: uppercase; font-size: 11.5px; }
  .app .steps { display: flex; margin: 20px 0 0; padding: 0; list-style: none; font-size: 11px; letter-spacing: .06em; color: var(--muted); }
  .app .steps li { flex: 1; padding-bottom: 8px; border-bottom: 1px solid var(--line); }
  .app .steps li span { display: block; font-size: 10px; margin-bottom: 1px; }
  .app .steps .done span::after { content: " ✓"; color: var(--sage-ink); }
  .app .steps .now { color: var(--ink); border-bottom: 2px solid var(--sage); }
  .app .msteps { margin-top: 16px; }
  .app .msteps .segs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
  .app .msteps .segs i { height: 2px; background: var(--sage); }
  .app .msteps .capt { display: block; font-size: 11px; letter-spacing: .06em; color: var(--muted); margin-top: 7px; }
  .app .msteps .capt b { color: var(--ink); font-weight: 500; }

  .app .hero { display: flex; align-items: center; gap: 14px; margin: 28px 0 8px; }
  .app .hero h4 { font-size: 24px; font-weight: 300; letter-spacing: .02em; margin: 0; }
  .phone .app .hero h4 { font-size: 21px; }
  .app .tick { flex: none; width: 30px; height: 30px; }
  .app .tick circle { fill: none; stroke: var(--sage); stroke-width: 1.4; stroke-dasharray: 88; stroke-dashoffset: 88; animation: draw 1.1s cubic-bezier(.6, 0, .2, 1) forwards .2s; }
  .app .tick path { fill: none; stroke: var(--sage); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 20; stroke-dashoffset: 20; animation: draw .6s ease forwards 1.1s; }
  .app .rule { height: 1px; width: 48px; background: var(--oak); margin: 0 0 12px; }
  .app .lede { margin: 0 0 22px; font-size: 13px; line-height: 1.6; color: var(--muted); max-width: 600px; }
  .app .label { display: block; font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin: 0 0 10px; }

  /* headline: dot grid */
  .app .headline { padding: 0 0 22px; border-bottom: 1px solid var(--line-soft); margin-bottom: 8px; }
  .app .big { font-size: 22px; font-weight: 300; line-height: 1.45; margin: 0 0 16px; max-width: 600px; }
  .phone .app .big { font-size: 19px; }
  .app .big b { font-weight: 500; color: var(--sage-ink); }
  .app .dots { display: grid; grid-template-columns: 60px 1fr; gap: 8px 12px; align-items: center; }
  .app .dots .dl { font-size: 11px; color: var(--muted); letter-spacing: .04em; }
  .app .dots .dg { display: flex; flex-wrap: wrap; gap: 5px; }
  .app .dots i { width: 11px; height: 11px; border-radius: 50%; border: 1.3px solid var(--line); box-sizing: border-box; }
  .app .dots i.y { border-color: var(--oak); background: var(--oak); }
  .app .dots .after i.y { border-color: var(--sage); background: var(--sage); }
  .app .dots i.y { animation: fillin .45s ease both; animation-delay: calc(var(--k) * 35ms + 500ms); }
  .app .dots .dn { grid-column: 2; font-size: 11.5px; color: var(--muted); }

  /* per question */
  .app .qres { padding: 18px 0 16px; border-bottom: 1px solid var(--line-soft); }
  .app .qres .qq { font-size: 15.5px; font-weight: 400; margin: 0 0 2px; }
  .app .qres .qid { font-size: 11px; color: var(--muted); letter-spacing: .04em; }
  .app .dumb { position: relative; height: 34px; margin: 14px 0 4px; }
  .app .dumb .axis { position: absolute; left: 0; right: 0; top: 16px; height: 1px; background: var(--line-soft); }
  .app .dumb .span { position: absolute; top: 15px; height: 3px; background: linear-gradient(to right, var(--oak), var(--sage)); border-radius: 2px; transform-origin: left; animation: grow 1.1s cubic-bezier(.2, .7, .2, 1) both .4s; }
  .app .dumb .pt { position: absolute; top: 10px; width: 13px; height: 13px; margin-left: -6.5px; border-radius: 50%; box-sizing: border-box; }
  .app .dumb .pt.b { border: 2px solid var(--oak); background: var(--page); }
  .app .dumb .pt.a { background: var(--sage); animation: slide 1.1s cubic-bezier(.2, .7, .2, 1) both .4s; }
  .app .dumb .lab { position: absolute; top: -6px; font-size: 11px; transform: translateX(-50%); white-space: nowrap; }
  .app .dumb .lab.b { color: var(--oak-ink); }
  .app .dumb .lab.a { color: var(--sage-ink); font-weight: 500; animation: fadein .5s ease both 1.2s; }
  .app .score { display: flex; justify-content: space-between; font-size: 12.5px; color: var(--muted); }
  .app .score b { font-weight: 500; color: var(--ink); }
  .app .insight { display: flex; gap: 10px; font-size: 13px; line-height: 1.55; margin: 10px 0 0; }
  .app .insight::before { content: ""; flex: none; width: 7px; height: 7px; margin-top: 7px; border-radius: 50%; border: 1.5px solid var(--oak); }
  .app .more { font: inherit; font-size: 12px; color: var(--sage-ink); background: none; border: 0; border-bottom: 1px solid var(--line); padding: 2px 0; margin-top: 10px; cursor: pointer; }
  .app .fold { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .55s cubic-bezier(.2, .7, .2, 1); }
  .app .qres.open .fold { grid-template-rows: 1fr; }
  .app .fold > div { overflow: hidden; }
  .app .cm { border-collapse: collapse; font-size: 12px; margin: 14px 0 8px; }
  .app .cm th { font-weight: 400; color: var(--muted); font-size: 10.5px; letter-spacing: .04em; padding: 4px 10px; text-align: center; }
  .app .cm th.rowh { text-align: right; }
  .app .cm td { width: 44px; height: 30px; text-align: center; border: 1px solid var(--page); }
  .app .cm td.hit { background: var(--sage-wash); color: var(--sage-ink); font-weight: 500; }
  .app .cm td.miss { background: var(--oak-wash); color: var(--oak-ink); font-weight: 500; }
  .app .cm td.zero { color: var(--line); }
  .app .cmcap { font-size: 11px; color: var(--muted); }
  .app .tech { font-size: 11.5px; color: var(--muted); line-height: 1.7; margin: 8px 0 4px; }
  .app .tech code { font-family: ui-monospace, monospace; font-size: 10.5px; font-variant-ligatures: none; }

  .app .runline { font-size: 12.5px; color: var(--muted); padding: 14px 0; border-bottom: 1px solid var(--line-soft); }
  .app .runline b { font-weight: 500; color: var(--ink); }

  /* next */
  .app .next { margin-top: 22px; }
  .app .nextrow { display: flex; align-items: center; gap: 14px; min-height: 56px; padding: 8px 0; border-bottom: 1px solid var(--line-soft); cursor: pointer; }
  .app .nextrow .nt { flex: 1; font-size: 14.5px; }
  .app .nextrow .nt small { display: block; font-size: 12px; color: var(--muted); margin-top: 1px; }
  .app .nextrow .ch { color: var(--sage-ink); font-size: 18px; }
  .app .nextrow.idea { border: 1px dashed var(--oak); border-radius: 3px; padding: 8px 12px; margin: 10px 0; }
  .app .nextrow.idea .tag { font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--oak-ink); }
  .app .primary { display: inline-flex; align-items: center; gap: 8px; font: inherit; font-size: 13.5px; color: var(--btn-ink); background: var(--sage); border: 1px solid var(--sage); border-radius: 2px; padding: 10px 20px; letter-spacing: .06em; cursor: pointer; text-decoration: none; transition: transform .3s ease; }
  .app .primary:hover { transform: translateY(-1px); }
  .phone .app .primary { width: 100%; justify-content: center; box-sizing: border-box; }
  .app .repo { font-size: 12px; color: var(--muted); margin: 8px 0 0; }
  .app .repo b { font-weight: 500; color: var(--ink); }

  @keyframes rise   { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @keyframes draw   { to { stroke-dashoffset: 0; } }
  @keyframes grow   { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  @keyframes slide  { from { left: var(--from); } }
  @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
  @keyframes fillin { from { background: transparent; border-color: var(--line); transform: scale(.6); } }
  .app .in { animation: rise .7s cubic-bezier(.2, .7, .2, 1) both; animation-delay: calc(var(--i, 0) * 90ms + 100ms); }
  @media (prefers-reduced-motion: reduce) { .tv *, .tv *::before, .tv *::after { animation: none !important; transition: none !important; } }
</style>

<h2>The Results step</h2>
<p class="subtitle">The recorded test run, in plain words first: how often it gets everything right, how each question improved, and what its mistakes have in common. Details fold under each question. Shown on a desktop and a phone. Click "See the details" to open one.</p>
<button class="theme" onclick="document.querySelectorAll('.tv').forEach((a) => a.classList.toggle('dark'))">Light / dark</button>

<div class="row2">
  <div style="flex:1 1 560px">
    <div class="deskwrap desk"><div class="app tv" id="d"></div></div>
    <p class="cap">Desktop</p>
  </div>
  <div>
    <div class="phone tv"><div class="app" id="p"></div></div>
    <p class="cap">Phone</p>
  </div>
</div>

<script>
  // From tests/ui/fixtures/recorded_run/metrics.json: 30 test tickets.
  const QS = [
    { id: "department", ask: "Which team should handle this ticket?", before: 11, after: 28,
      labels: ["account", "billing", "technical"], cm: [[9, 1, 0], [0, 9, 0], [1, 0, 10]],
      insight: "Its 2 mistakes: one <b>account</b> ticket sent to billing, and one <b>technical</b> ticket sent to account.",
      tech: "Macro-F1 0.37 → 0.93 · log-loss 1.18 → 0.25 · calibration error 12.6% → 12.1%" },
    { id: "urgency", ask: "How soon does this ticket need a reply?", before: 10, after: 27,
      labels: ["Can wait", "This week", "Today"], cm: [[12, 1, 1], [0, 10, 1], [0, 0, 5]],
      insight: "When it's wrong, it leans <b>more urgent</b>: all 3 mistakes picked a sooner reply than needed.",
      tech: "Macro-F1 0.30 → 0.89 · average error 0.71 → 0.22 steps · log-loss 1.29 → 0.26" },
    { id: "outage", ask: "Is something down or unusable for this customer?", before: 19, after: 27,
      labels: ["yes", "no"], cm: [[5, 0], [3, 22]],
      insight: "It caught <b>all 5 real outages</b>. Its 3 mistakes were false alarms.",
      tech: "Macro-F1 0.15 → 0.77 · log-loss 0.65 → 0.56" },
  ];
  const N = 30;
  const pct = (k) => Math.round((k / N) * 100);

  function dots(k, cls) {
    let out = "";
    for (let j = 0; j < N; j++) out += `<i class="${j < k ? "y" : ""}" style="--k:${j}"></i>`;
    return `<div class="dg ${cls}">${out}</div>`;
  }
  function cm(q) {
    const head = q.labels.map((l) => `<th>${l}</th>`).join("");
    const rows = q.cm.map((r, i) => `<tr><th class="rowh">${q.labels[i]}</th>${r.map((v, j) =>
      `<td class="${v === 0 ? "zero" : i === j ? "hit" : "miss"}">${v}</td>`).join("")}</tr>`).join("");
    return `<table class="cm"><tr><th></th>${head}</tr>${rows}</table>
      <div class="cmcap">Rows are the real answer and columns are the model's answer. Green is right, tan is a mistake.</div>`;
  }
  function qres(q, i) {
    const b = pct(q.before), a = pct(q.after);
    return `<div class="qres in" style="--i:${i + 3}">
      <div class="qq">${q.ask}</div><span class="qid">${q.id}</span>
      <div class="dumb"><span class="axis"></span>
        <span class="span" style="left:${b}%; width:${a - b}%"></span>
        <span class="lab b" style="left:${b}%">${b}%</span><span class="lab a" style="left:${a}%">${a}%</span>
        <span class="pt b" style="left:${b}%"></span><span class="pt a" style="left:${a}%; --from:${b}%"></span></div>
      <div class="score"><span>Before: right ${q.before} of ${N}</span><span>After: <b>right ${q.after} of ${N}</b></span></div>
      <p class="insight"><span>${q.insight}</span></p>
      <button class="more" onclick="this.closest('.qres').classList.toggle('open'); this.textContent = this.closest('.qres').classList.contains('open') ? 'Hide the details' : 'See the details'">See the details</button>
      <div class="fold"><div>${cm(q)}<p class="tech">${q.tech}</p></div></div>
    </div>`;
  }
  function content(phone) {
    const steps = phone
      ? `<div class="msteps"><div class="segs"><i></i><i></i><i></i><i></i></div><span class="capt">Done · <b>Results</b></span></div>`
      : `<ol class="steps"><li class="done"><span>01</span>Your data</li><li class="done"><span>02</span>What to predict</li><li class="done"><span>03</span>Settings</li><li class="now done"><span>04</span>Train</li></ol>`;
    return `<div class="top"><span class="mark"></span><b>clef-tune</b></div>${steps}
      <div class="hero in"><svg class="tick" viewBox="0 0 30 30"><circle cx="15" cy="15" r="14"/><path d="M9.5 15.5l4 4 7-8"/></svg><h4>support-tickets is ready</h4></div>
      <div class="rule in"></div>
      <p class="lede in">We tested it on 30 of your tickets that it never saw during training, before and after.</p>
      <div class="headline in" style="--i:1">
        <p class="big">It now gets every answer right on <b>24 of 30</b> tickets. Before training, it managed 2.</p>
        <div class="dots"><span class="dl">Before</span>${dots(2, "before")}<span class="dl">After</span>${dots(24, "after")}
          <span class="dn">Each dot is one test ticket. A filled dot means all three answers were right.</span></div>
      </div>
      <span class="label in" style="--i:2; margin-top:18px">Question by question</span>
      ${QS.map(qres).join("")}
      <div class="runline in" style="--i:6">Training took <b>25 minutes</b> and cost <b>$0.34</b>, against an estimate of $0.40.</div>
      <div class="next in" style="--i:7">
        <span class="label">What's next</span>
        <a class="primary" href="#" onclick="event.preventDefault()">Open on Hugging Face ↗</a>
        <p class="repo">Saved privately to <b>hvgupta1/support-tickets</b></p>
        <div class="nextrow idea"><span class="nt"><span class="tag">Idea · not built yet</span><br>Predict a new spreadsheet<small>Upload new tickets and get them back with the model's answers filled in.</small></span><span class="ch">›</span></div>
        <div class="nextrow"><span class="nt">Train again with changes<small>Go back to any step. Your data and questions are kept.</small></span><span class="ch">›</span></div>
        <div class="nextrow"><span class="nt">For developers<small>Python and command-line snippets that load this model.</small></span><span class="ch">›</span></div>
      </div>`;
  }
  document.getElementById("d").innerHTML = content(false);
  document.getElementById("p").innerHTML = content(true);
</script>
