[build-system]
requires = ["hatchling>=1.25", "hatch-vcs>=0.4"]
build-backend = "hatchling.build"

[project]
name = "clef-tune"
dynamic = ["version"]
description = "Fine-tuning harness for Cloudflare's Clef decision models"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
  "huggingface_hub>=1.33,<2",
  "numpy>=2.0",
  "pillow>=10.0",
  "pydantic>=2.11",
  "pyyaml>=6.0",
  "rich>=13.0",
  "tokenizers>=0.22",
  "typer>=0.12",
]

[project.optional-dependencies]
ui = ["gradio>=6.0"]
train = [
  "torch>=2.11,<2.12",
  "torchvision>=0.26,<0.27",
  "transformers>=5.10.2,<5.11",
  "peft>=0.21",
  "accelerate>=1.10",
  "bitsandbytes>=0.45",
  "safetensors>=0.5",
]
dev = ["pytest>=8.0", "ruff>=0.6", "playwright>=1.45"]

[project.scripts]
clef-tune = "clef_tune.cli:app"

[project.urls]
Homepage = "https://github.com/hersh-gupta/clef-tune"
Source = "https://github.com/hersh-gupta/clef-tune"

[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.0"

[tool.hatch.build.hooks.vcs]
version-file = "clef_tune/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["clef_tune"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not gpu and not hfjobs'"
markers = [
  "torch: needs torch (tiny-model tests)",
  "gpu: needs a CUDA GPU and real model weights (opt-in)",
  "hfjobs: submits a real Hugging Face Job (opt-in, costs money)",
  "network: downloads from the Hugging Face Hub",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cu130", marker = "sys_platform == 'win32'" }]
torchvision = [{ index = "pytorch-cu130", marker = "sys_platform == 'win32'" }]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
